<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Page introuvable · Mohammed Ennouaim</title>
<style>
:root{color-scheme:light dark;--bg:#f6f8fc;--fg:#0a0f17;--mut:#5b6678;--blue:#1f6feb}
@media (prefers-color-scheme:dark){:root{--bg:#0a0f17;--fg:#eef2f8;--mut:#9aa6b8;--blue:#6aa7ff}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;text-align:center}
main{max-width:520px}.code{font-size:clamp(4rem,18vw,7rem);font-weight:800;letter-spacing:-.04em;color:var(--blue);line-height:1}
h1{font-size:1.5rem;margin:.6em 0 .3em}p{color:var(--mut);margin:0 0 1.6em}
a{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:12px}
a:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="code" aria-hidden="true">404</div>
  <h1>Page introuvable / Page not found</h1>
  <p>Cette adresse n'existe pas ou a été déplacée.<br>This address does not exist or has moved.</p>
  <a href="https://ennouaim.com/">Retour au portfolio / Back to portfolio</a>
</main>
</body>
</html>
